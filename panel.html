<!doctype html>
<html lang="zh-CN" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据统计</title>
<style>
  :root {
    --surface-solid: #ffffff;
    --surface-raised: #f6f6f3;
    --ink: #1d1d1f;
    --ink-soft: #6b6b70;
    --line: #deded9;
    --accent: #2f6fed;
    --accent-ink: #ffffff;
    --danger: #c0392b;
    --success: #218739;
    --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    --font-display: var(--font-body);
    --c-text: #4f7fe8;
    --c-link: #2f9d8d;
    --c-color: #c98a33;
    --c-media: #9a6fd0;
    --c-file: #d2647d;
    --c-unknown: #8a8a8e;
    --heat-0: #f0f0ec;
    --heat-1: #dbe6fb;
    --heat-2: #b6cdf6;
    --heat-3: #7da3ee;
    --heat-4: #3f72e0;
    --shadow: 0 1px 2px rgba(20, 20, 24, 0.05);
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-pill: 999px;
    color-scheme: light;
  }
  :root[data-scheme="dark"] {
    --surface-solid: #1c1c1e;
    --surface-raised: #262628;
    --ink: #f2f2f4;
    --ink-soft: #a1a1a6;
    --line: #3a3a3d;
    --accent: #6f9dff;
    --accent-ink: #101014;
    --danger: #ff7b6f;
    --success: #5fd07e;
    --c-text: #82a8ff;
    --c-link: #63c9b8;
    --c-color: #e0ac5f;
    --c-media: #bd97ea;
    --c-file: #ee91a4;
    --c-unknown: #9a9aa0;
    --heat-0: #2a2a2d;
    --heat-1: #233250;
    --heat-2: #2f4b7e;
    --heat-3: #4d75c0;
    --heat-4: #7da3ee;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface-solid);
    color: var(--ink);
    font: 13px/1.5 var(--font-body);
    overflow: auto;
  }
  .page {
    display: grid;
    grid-template-rows: auto auto auto auto;
    align-content: start;
    gap: 8px;
    min-height: 100%;
    max-width: 1060px;
    margin: 0 auto;
    padding: 12px 20px 6px;
  }
  .head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin: 0;
  }
  .eyebrow {
    margin: 0 0 3px;
    color: var(--ink-soft);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.16em;
  }
  h1 {
    margin: 0;
    font: 600 19px/1.2 var(--font-display);
    letter-spacing: 0.01em;
  }
  .head-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 8px;
    flex: none;
  }
  .updated {
    color: var(--ink-soft);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .refresh {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface-raised);
    color: var(--ink);
    cursor: pointer;
  }
  .refresh:hover { color: var(--accent); }
  .refresh:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .refresh:disabled { cursor: default; color: var(--ink-soft); }
  .refresh svg { width: 15px; height: 15px; }
  .refresh.loading svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .refresh.loading svg { animation: none; }
  }

  .notice {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface-raised);
    color: var(--ink-soft);
  }
  .notice[data-tone="danger"] { color: var(--danger); }
  .notice[hidden] { display: none; }

  .kpis {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
    margin: 0;
  }
  .kpi {
    position: relative;
    min-width: 0;
    padding: 6px 10px 5px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--surface-raised);
    box-shadow: var(--shadow);
  }
  .kpi:first-child {
    background: var(--surface-raised);
  }
  .kpi-label {
    display: block;
    color: var(--ink-soft);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .kpi-value {
    display: block;
    margin-top: 3px;
    font: 600 20px/1.05 var(--font-display);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .kpi-unit {
    margin-left: 3px;
    color: var(--ink-soft);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0;
  }
  .kpi-note {
    display: block;
    margin-top: 2px;
    min-height: 13px;
    overflow: hidden;
    color: var(--ink-soft);
    font-size: 10px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kpi-note[data-tone="up"] { color: var(--success); }

  .grid {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(252px, 0.8fr);
    grid-template-rows: auto auto auto;
    gap: 10px;
    min-height: 0;
  }
  .card {
    display: flex;
    min-width: 0;
    min-height: 0;
    flex-direction: column;
    padding: 9px 12px 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: var(--surface-raised);
    box-shadow: var(--shadow);
  }
  .card-chart { grid-column: 1; grid-row: 1; }
  .card-donut { grid-column: 2; grid-row: 1; }
  .card-heat { grid-column: 1; grid-row: 2; }
  .card-sources { grid-column: 2; grid-row: 2; }
  .card-wide { grid-column: 1 / -1; grid-row: 3; }
  .card-head {
    display: flex;
    flex: none;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 5px;
  }
  .card-head h2 {
    margin: 0;
    font: 600 13px/1.3 var(--font-display);
  }
  .card-head p {
    margin: 1px 0 0;
    color: var(--ink-soft);
    font-size: 10px;
  }
  .card-meta {
    flex: none;
    color: var(--ink-soft);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .legend {
    display: flex;
    flex: none;
    flex-wrap: wrap;
    gap: 3px 11px;
    min-height: 13px;
    margin: -2px 0 4px;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0;
    border: 0;
    background: none;
    color: var(--ink-soft);
    font: 10px/1.3 var(--font-body);
    cursor: pointer;
  }
  .legend-item:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--radius-xs);
  }
  .legend-item.active { color: var(--ink); }
  .dot {
    width: 8px;
    height: 8px;
    flex: none;
    border-radius: 50%;
    background: var(--c-unknown);
  }

  .plot {
    position: relative;
    flex: 1;
    min-height: 52px;
    margin-top: 4px;
    background-image: repeating-linear-gradient(
      to top,
      transparent 0,
      transparent calc(25% - 1px),
      var(--line) calc(25% - 1px),
      var(--line) 25%
    );
    background-size: 100% 100%;
    opacity: 1;
  }
  .bars {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    gap: 3px;
  }
  .bar-col {
    display: flex;
    min-width: 0;
    height: 100%;
    flex: 1;
    align-items: flex-end;
  }
  .bar-stack {
    display: flex;
    width: 100%;
    min-height: 2px;
    flex-direction: column-reverse;
    overflow: hidden;
    border-radius: var(--radius-xs) var(--radius-xs) 0 0;
    transition: height 240ms ease;
  }
  .bar-stack.empty {
    height: 2px !important;
    background: var(--line);
    opacity: 0.65;
  }
  .bar-seg {
    width: 100%;
    min-height: 1px;
    transition: opacity 140ms ease;
  }
  .bar-seg.dim, .donut-seg.dim { opacity: 0.18; }
  .axis {
    display: flex;
    flex: none;
    gap: 3px;
    margin-top: 4px;
    color: var(--ink-soft);
    font-size: 8px;
    font-variant-numeric: tabular-nums;
  }
  .axis span {
    min-width: 0;
    flex: 1;
    overflow: visible;
    text-align: center;
    white-space: nowrap;
  }

  .donut-body {
    display: flex;
    min-height: 0;
    flex: 1;
    align-items: center;
    gap: 12px;
  }
  .donut-wrap {
    position: relative;
    flex: none;
    width: 96px;
    height: 96px;
    margin: 0;
  }
  .donut-wrap svg { width: 96px; height: 96px; display: block; }
  .donut-bg { fill: none; stroke: var(--line); stroke-width: 17; opacity: 0.55; }
  .donut-seg { fill: none; stroke-width: 17; transition: opacity 140ms ease; }
  .donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .donut-center strong {
    font: 600 20px/1 var(--font-display);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .donut-center span { margin-top: 2px; color: var(--ink-soft); font-size: 9px; }
  .donut-legend {
    display: flex;
    min-width: 0;
    flex: 1;
    flex-direction: column;
    gap: 0;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .donut-row {
    display: flex;
    width: 100%;
    align-items: center;
    gap: 6px;
    padding: 2px 4px;
    border: 0;
    border-radius: var(--radius-sm);
    background: none;
    color: var(--ink);
    font: 11px/1.3 var(--font-body);
    text-align: left;
    cursor: pointer;
  }
  .donut-row:hover { background: var(--surface-solid); }
  .donut-row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .donut-row.active { background: var(--surface-solid); }
  .donut-row .name {
    min-width: 0;
    overflow: hidden;
    flex: 1;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .donut-row .count {
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .donut-row .share {
    width: 34px;
    color: var(--ink-soft);
    font-size: 10px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .heat-grid {
    display: grid;
    grid-template-columns: 24px repeat(24, minmax(0, 1fr));
    gap: 2px;
    align-items: center;
  }
  .heat-label {
    color: var(--ink-soft);
    font-size: 8px;
    line-height: 10px;
    text-align: right;
    white-space: nowrap;
  }
  .heat-cell {
    display: block;
    height: 8px;
    border-radius: var(--radius-xs);
    background: var(--heat-0);
  }
  .heat-cell[data-level="1"] { background: var(--heat-1); }
  .heat-cell[data-level="2"] { background: var(--heat-2); }
  .heat-cell[data-level="3"] { background: var(--heat-3); }
  .heat-cell[data-level="4"] { background: var(--heat-4); }
  .heat-axis {
    display: grid;
    flex: none;
    grid-template-columns: 24px repeat(24, minmax(0, 1fr));
    gap: 2px;
    margin-top: 3px;
    color: var(--ink-soft);
    font-size: 8px;
    font-variant-numeric: tabular-nums;
  }
  .heat-axis span { text-align: center; }

  .sources {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 5px 14px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .source-row {
    display: grid;
    grid-template-columns: minmax(0, 78px) minmax(0, 1fr) 26px;
    align-items: center;
    gap: 7px;
  }
  .source-name {
    overflow: hidden;
    font-size: 11px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .source-track {
    height: 6px;
    overflow: hidden;
    border-radius: var(--radius-pill);
    background: var(--surface-solid);
  }
  .source-track i {
    display: block;
    height: 100%;
    border-radius: var(--radius-pill);
    background: var(--accent);
    opacity: 0.72;
  }
  .source-count {
    color: var(--ink-soft);
    font-size: 11px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .empty-note {
    margin: 0;
    padding: 9px 0 3px;
    color: var(--ink-soft);
    font-size: 11px;
  }

  .detail {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 5px 20px;
  }
  .detail-row { min-width: 0; }
  .detail-top {
    display: flex;
    align-items: baseline;
    gap: 7px;
    margin-bottom: 3px;
  }
  .detail-top .dot { align-self: center; }
  .detail-name { flex: 1; font-size: 12px; }
  .detail-count {
    font: 600 13px/1 var(--font-display);
    font-variant-numeric: tabular-nums;
  }
  .detail-share {
    width: 38px;
    color: var(--ink-soft);
    font-size: 10px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .detail-track {
    height: 4px;
    overflow: hidden;
    border-radius: var(--radius-pill);
    background: var(--surface-solid);
  }
  .detail-track i {
    display: block;
    height: 100%;
    border-radius: var(--radius-pill);
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 3px;
  }
  .chip {
    padding: 0 5px;
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    color: var(--ink-soft);
    font-size: 9px;
    font-variant-numeric: tabular-nums;
  }
  .chip b { color: var(--ink); font-weight: 600; }

  .privacy {
    margin: 0;
    color: var(--ink-soft);
    font-size: 9px;
    text-align: center;
  }

  @media (max-width: 760px) {
    .page { height: auto; min-height: 100%; padding: 16px 16px 20px; }
    .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
    .card-chart, .card-donut, .card-heat, .card-sources, .card-wide {
      grid-column: auto;
      grid-row: auto;
    }
    .detail { grid-template-columns: minmax(0, 1fr); }
    .head { flex-direction: column; gap: 4px; }
    .head-actions { padding-top: 0; }
  }
  /* A very short window keeps the report readable by letting the page scroll
     instead of squeezing every card below its content. */
  @media (max-height: 620px) {
    .page { height: auto; min-height: 100%; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div>
      <p class="eyebrow">MYPASTE · 数据概览</p>
      <h1>数据统计</h1>
    </div>
    <div class="head-actions">
      <span class="updated" id="updated" aria-live="polite">正在读取…</span>
      <button class="refresh" id="refresh" type="button" aria-label="刷新统计">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.7-4" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round"/>
          <path d="M12.6 1.9v3.2H9.4" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <section class="kpis" aria-label="关键数字">
    <article class="kpi">
      <span class="kpi-label">总条目</span>
      <span class="kpi-value"><span id="kpi-items">—</span><span class="kpi-unit">条</span></span>
      <span class="kpi-note" id="kpi-items-note">当前保留的数据</span>
    </article>
    <article class="kpi">
      <span class="kpi-label">今日新增</span>
      <span class="kpi-value"><span id="kpi-today">—</span><span class="kpi-unit">条</span></span>
      <span class="kpi-note" id="kpi-today-note">—</span>
    </article>
    <article class="kpi">
      <span class="kpi-label">近 7 天</span>
      <span class="kpi-value"><span id="kpi-week">—</span><span class="kpi-unit">条</span></span>
      <span class="kpi-note">过去一周新增</span>
    </article>
    <article class="kpi">
      <span class="kpi-label">置顶</span>
      <span class="kpi-value"><span id="kpi-pinned">—</span><span class="kpi-unit">条</span></span>
      <span class="kpi-note">长期保留</span>
    </article>
    <article class="kpi">
      <span class="kpi-label">来源应用</span>
      <span class="kpi-value"><span id="kpi-sources">—</span><span class="kpi-unit">个</span></span>
      <span class="kpi-note" id="kpi-sources-note">—</span>
    </article>
  </section>

  <div class="grid">
    <section class="card card-chart">
      <header class="card-head">
        <div>
          <h2>近 30 天</h2>
          <p>每天新增的条目，按类型堆叠</p>
        </div>
        <span class="card-meta" id="peak">—</span>
      </header>
      <div class="legend" id="chart-legend"></div>
      <div class="plot" id="chart" role="img" aria-label="近 30 天条目构成柱状图"></div>
      <div class="axis" id="axis"></div>
    </section>

    <section class="card card-donut">
      <header class="card-head">
        <div>
          <h2>类型构成</h2>
          <p>每种内容占全部条目的比例</p>
        </div>
      </header>
      <div class="donut-body">
        <div class="donut-wrap">
          <svg viewBox="0 0 148 148" role="img" aria-label="类型构成环形图">
            <circle class="donut-bg" cx="74" cy="74" r="55"></circle>
            <g id="donut-segments" transform="rotate(-90 74 74)"></g>
          </svg>
          <div class="donut-center">
            <strong id="donut-total">0</strong>
            <span>条目</span>
          </div>
        </div>
        <ul class="donut-legend" id="donut-legend"></ul>
      </div>
    </section>

    <section class="card card-heat">
      <header class="card-head">
        <div>
          <h2>记录节律</h2>
          <p>一周里哪些时段更常复制</p>
        </div>
        <span class="card-meta">近 8 周</span>
      </header>
      <div class="heat-grid" id="heat" role="img" aria-label="按星期与小时统计的复制节律热力图"></div>
      <div class="heat-axis" id="heat-axis" aria-hidden="true"></div>
    </section>

    <section class="card card-sources">
      <header class="card-head">
        <div>
          <h2>来源应用</h2>
          <p>条目最多的应用</p>
        </div>
      </header>
      <ul class="sources" id="sources"></ul>
    </section>

    <section class="card card-wide">
      <header class="card-head">
        <div>
          <h2>类型明细</h2>
          <p>文字、链接、媒体与文件的内部构成</p>
        </div>
      </header>
      <div class="detail" id="detail"></div>
    </section>
  </div>

  <p class="privacy">统计只包含数量与宿主提供的类型名称，不读取条目正文、标题或文件路径。</p>
</div>

<script>
(function () {
  "use strict";

  var root = document.documentElement;
  var updated = document.getElementById("updated");
  var refresh = document.getElementById("refresh");
  var notice = document.getElementById("notice");
  var pending = new Map();
  var sequence = 0;
  var state = { data: null, focus: "" };

  var colors = {
    text: "var(--c-text)",
    link: "var(--c-link)",
    color: "var(--c-color)",
    media: "var(--c-media)",
    file: "var(--c-file)"
  };
  var weekdayNames = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];

  function colorOf(form) {
    return colors[form] || "var(--c-unknown)";
  }

  function number(value) {
    return Number(value || 0).toLocaleString("zh-CN");
  }

  function percent(value, total) {
    if (!total) return "0%";
    var share = (value / total) * 100;
    if (share > 0 && share < 0.5) return "<0.5%";
    return Math.round(share) + "%";
  }

  function ioError(error) {
    return error instanceof Error ? error.message : String(error);
  }

  function call(method) {
    return new Promise(function (resolve, reject) {
      var requestId = ++sequence;
      pending.set(requestId, { resolve: resolve, reject: reject });
      parent.postMessage({ v: 1, type: "call", requestId: requestId, method: method }, "*");
    });
  }

  function applyTheme(message) {
    root.dataset.scheme = message.scheme === "dark" ? "dark" : "light";
    var tokens = message.tokens || {};
    Object.keys(tokens).forEach(function (name) {
      root.style.setProperty("--" + name, tokens[name]);
    });
  }

  window.addEventListener("message", function (event) {
    var message = event.data;
    if (!message || message.v !== 1) return;
    if (message.type === "theme") { applyTheme(message); return; }
    if (message.type !== "result") return;
    var entry = pending.get(message.requestId);
    if (!entry) return;
    pending.delete(message.requestId);
    if (message.ok) entry.resolve(message.value);
    else entry.reject(new Error(message.error || "操作失败"));
  });

  function showNotice(text, tone) {
    notice.textContent = text || "";
    if (tone) notice.dataset.tone = tone;
    else delete notice.dataset.tone;
    notice.hidden = !text;
  }

  function setLoading(loading) {
    refresh.disabled = loading;
    refresh.classList.toggle("loading", loading);
  }

  function topForms() {
    return ((state.data && state.data.forms) || []).filter(function (form) {
      return !form.parent;
    });
  }

  function render(data) {
    state.data = data;
    var totals = data.totals || {};
    document.getElementById("kpi-items").textContent = number(totals.items);
    document.getElementById("kpi-today").textContent = number(totals.today);
    document.getElementById("kpi-week").textContent = number(totals.last7Days);
    document.getElementById("kpi-pinned").textContent = number(totals.pinned);
    document.getElementById("kpi-sources").textContent = number(totals.sources);

    var days = data.days || [];
    var yesterday = days.length > 1 ? days[days.length - 2].total : 0;
    var delta = (totals.today || 0) - yesterday;
    var todayNote = document.getElementById("kpi-today-note");
    todayNote.textContent = delta === 0
      ? "与昨日持平"
      : (delta > 0 ? "较昨日 +" + number(delta) : "较昨日 " + number(delta));
    if (delta > 0) todayNote.dataset.tone = "up";
    else delete todayNote.dataset.tone;

    var itemsNote = document.getElementById("kpi-items-note");
    itemsNote.textContent = totals.items
      ? "近 30 天 " + number(totals.last30Days) + " 条"
      : "还没有可统计的数据";
    document.getElementById("kpi-sources-note").textContent = totals.sources
      ? "看板 " + number(totals.boards) + " · 搜索 " + number(totals.savedSearches)
      : "—";

    var stamp = new Date(data.generatedAt || Date.now());
    updated.textContent = "更新于 " + String(stamp.getHours()).padStart(2, "0") +
      ":" + String(stamp.getMinutes()).padStart(2, "0");

    renderChart(data);
    renderDonut(data);
    renderHeat(data);
    renderSources(data);
    renderDetail(data);
    applyFocus();

    if (!totals.items) {
      showNotice("还没有可统计的数据。复制内容后回到这里刷新即可。", "info");
    } else {
      showNotice("", "");
    }
  }

  function renderChart(data) {
    var days = data.days || [];
    var forms = topForms().filter(function (form) { return form.count > 0; });
    var legend = document.getElementById("chart-legend");
    var chart = document.getElementById("chart");
    var axis = document.getElementById("axis");
    var peak = document.getElementById("peak");
    legend.textContent = "";
    chart.textContent = "";
    axis.textContent = "";

    var max = 1;
    days.forEach(function (day) { max = Math.max(max, day.total); });
    peak.textContent = days.length ? "峰值 " + number(max) + " 条" : "—";

    forms.forEach(function (form) {
      var item = document.createElement("span");
      item.className = "legend-item";
      var dot = document.createElement("i");
      dot.className = "dot";
      dot.style.background = colorOf(form.form);
      item.appendChild(dot);
      item.appendChild(document.createTextNode(form.label));
      legend.appendChild(item);
    });

    var bars = document.createElement("div");
    bars.className = "bars";
    days.forEach(function (day) {
      var column = document.createElement("div");
      column.className = "bar-col";
      column.title = day.date + " · " + number(day.total) + " 条";
      var stack = document.createElement("div");
      stack.className = "bar-stack" + (day.total ? "" : " empty");
      stack.style.height = day.total ? Math.max(2, (day.total / max) * 100) + "%" : "2px";
      (day.counts || []).forEach(function (count) {
        if (!count.count) return;
        var segment = document.createElement("div");
        segment.className = "bar-seg";
        segment.dataset.form = count.form || "";
        segment.style.height = (count.count / day.total) * 100 + "%";
        segment.style.background = colorOf(count.form);
        stack.appendChild(segment);
      });
      column.appendChild(stack);
      bars.appendChild(column);
    });
    chart.appendChild(bars);

    days.forEach(function (day, index) {
      var label = document.createElement("span");
      if (index === 0 || index === days.length - 1 || index % 5 === 0) {
        label.textContent = day.date.slice(5).replace("-", "/");
      }
      axis.appendChild(label);
    });
  }

  function renderDonut(data) {
    var total = (data.totals && data.totals.items) || 0;
    var forms = topForms().filter(function (form) { return form.count > 0; });
    var group = document.getElementById("donut-segments");
    var legend = document.getElementById("donut-legend");
    group.textContent = "";
    legend.textContent = "";
    document.getElementById("donut-total").textContent = number(total);

    var circumference = 2 * Math.PI * 55;
    var offset = 0;
    forms.forEach(function (form) {
      var length = total ? (form.count / total) * circumference : 0;
      var circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("class", "donut-seg");
      circle.setAttribute("cx", "74");
      circle.setAttribute("cy", "74");
      circle.setAttribute("r", "55");
      circle.setAttribute("stroke", colorOf(form.form));
      circle.setAttribute("stroke-dasharray", Math.max(0, length - 2) + " " + circumference);
      circle.setAttribute("stroke-dashoffset", String(-offset));
      circle.dataset.form = form.form || "";
      var title = document.createElementNS("http://www.w3.org/2000/svg", "title");
      title.textContent = form.label + " · " + number(form.count) + " 条";
      circle.appendChild(title);
      group.appendChild(circle);
      offset += length;

      var row = document.createElement("li");
      var button = document.createElement("button");
      button.type = "button";
      button.className = "donut-row";
      button.dataset.form = form.form || "";
      button.setAttribute("aria-pressed", "false");
      var dot = document.createElement("i");
      dot.className = "dot";
      dot.style.background = colorOf(form.form);
      var name = document.createElement("span");
      name.className = "name";
      name.textContent = form.label;
      var count = document.createElement("span");
      count.className = "count";
      count.textContent = number(form.count);
      var share = document.createElement("span");
      share.className = "share";
      share.textContent = percent(form.count, total);
      button.append(dot, name, count, share);
      button.addEventListener("click", function () {
        state.focus = state.focus === form.form ? "" : form.form;
        applyFocus();
      });
      row.appendChild(button);
      legend.appendChild(row);
    });
  }

  function renderHeat(data) {
    var grid = document.getElementById("heat");
    var axis = document.getElementById("heat-axis");
    grid.textContent = "";
    axis.textContent = "";

    var buckets = new Map();
    var max = 1;
    (data.activity || []).forEach(function (bucket) {
      buckets.set(bucket.weekday * 24 + bucket.hour, bucket.count);
      max = Math.max(max, bucket.count);
    });

    weekdayNames.forEach(function (name, weekday) {
      var label = document.createElement("span");
      label.className = "heat-label";
      label.textContent = name;
      grid.appendChild(label);
      for (var hour = 0; hour < 24; hour++) {
        var count = buckets.get(weekday * 24 + hour) || 0;
        var cell = document.createElement("i");
        cell.className = "heat-cell";
        cell.dataset.level = String(count ? Math.min(4, Math.ceil((count / max) * 4)) : 0);
        cell.title = name + " " + String(hour).padStart(2, "0") + ":00 · " + number(count) + " 条";
        grid.appendChild(cell);
      }
    });

    axis.appendChild(document.createElement("span"));
    for (var hour = 0; hour < 24; hour++) {
      var label = document.createElement("span");
      if (hour === 0 || hour === 6 || hour === 12 || hour === 18 || hour === 23) {
        label.textContent = String(hour);
      }
      axis.appendChild(label);
    }
  }

  function renderSources(data) {
    var list = document.getElementById("sources");
    list.textContent = "";
    var sources = data.sources || [];
    if (!sources.length) {
      var empty = document.createElement("li");
      empty.className = "empty-note";
      empty.textContent = "还没有来源应用的数据。";
      list.appendChild(empty);
      return;
    }
    var max = sources[0].count || 1;
    sources.forEach(function (source) {
      var row = document.createElement("li");
      row.className = "source-row";
      var name = document.createElement("span");
      name.className = "source-name";
      name.textContent = source.name;
      name.title = source.name;
      var track = document.createElement("span");
      track.className = "source-track";
      var fill = document.createElement("i");
      fill.style.width = Math.max(3, (source.count / max) * 100) + "%";
      track.appendChild(fill);
      var count = document.createElement("span");
      count.className = "source-count";
      count.textContent = number(source.count);
      row.append(name, track, count);
      list.appendChild(row);
    });
  }

  function renderDetail(data) {
    var detail = document.getElementById("detail");
    detail.textContent = "";
    var total = (data.totals && data.totals.items) || 0;
    var forms = data.forms || [];
    topForms().forEach(function (form) {
      if (!form.count && total) return;
      var row = document.createElement("div");
      row.className = "detail-row";
      var top = document.createElement("div");
      top.className = "detail-top";
      var dot = document.createElement("i");
      dot.className = "dot";
      dot.style.background = colorOf(form.form);
      var name = document.createElement("span");
      name.className = "detail-name";
      name.textContent = form.label;
      var count = document.createElement("span");
      count.className = "detail-count";
      count.textContent = number(form.count);
      var share = document.createElement("span");
      share.className = "detail-share";
      share.textContent = percent(form.count, total);
      top.append(dot, name, count, share);

      var track = document.createElement("div");
      track.className = "detail-track";
      var fill = document.createElement("i");
      fill.style.width = Math.max(0, (form.count / Math.max(1, total)) * 100) + "%";
      fill.style.background = colorOf(form.form);
      track.appendChild(fill);

      var chips = document.createElement("div");
      chips.className = "chips";
      forms.filter(function (child) {
        return child.parent === form.form && child.count > 0;
      }).forEach(function (child) {
        var chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = child.label + " ";
        var value = document.createElement("b");
        value.textContent = number(child.count);
        chip.appendChild(value);
        chips.appendChild(chip);
      });
      if (!chips.childNodes.length) chips.remove();

      row.append(top, track);
      if (chips.childNodes.length) row.appendChild(chips);
      detail.appendChild(row);
    });
  }

  function applyFocus() {
    var focus = state.focus;
    var segments = document.querySelectorAll(".bar-seg, .donut-seg");
    for (var index = 0; index < segments.length; index++) {
      var segment = segments[index];
      segment.classList.toggle("dim", Boolean(focus) && segment.dataset.form !== focus);
    }
    var rows = document.querySelectorAll(".donut-row");
    for (var rowIndex = 0; rowIndex < rows.length; rowIndex++) {
      var row = rows[rowIndex];
      var active = Boolean(focus) && row.dataset.form === focus;
      row.classList.toggle("active", active);
      row.setAttribute("aria-pressed", active ? "true" : "false");
    }
  }

  async function load() {
    setLoading(true);
    try {
      var value = await call("stats.read");
      if (!value || typeof value !== "object") throw new Error("宿主没有返回统计结果");
      state.focus = "";
      render(value);
    } catch (error) {
      showNotice("无法读取统计：" + ioError(error), "danger");
      updated.textContent = "读取失败";
    } finally {
      setLoading(false);
    }
  }

  refresh.addEventListener("click", function () { load(); });
  parent.postMessage({ v: 1, type: "ready" }, "*");
  load();
})();
</script>
</body>
</html>
